media:
  input: static/uploads
  output: /uploads
  categories: [image]
  extensions: [jpg, jpeg, webp]
  rename: safe

content:
  # Ordinary pages: everything in content except calendar entries.
  - name: pages
    label: Home
    type: collection
    path: content
    format: yaml-frontmatter
    subfolders: true

    exclude:
      - img

    filename:
      template: "{primary}.md"
      field: true

    fields:
      - name: title
        label: Page title
        type: string
        description: "Title for your page."

      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown
          switcher: true

settings:
  content:
    merge: true